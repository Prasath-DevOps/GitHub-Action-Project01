      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/github-action-project1
            cd /home/ubuntu/github-action-project1

            echo "Files on EC2:"
            ls -la

            docker stop github-actions-demo-container || true
            docker rm github-actions-demo-container || true

            docker build --no-cache -t github-actions-demo .

            docker run -d \
              --name github-actions-demo-container \
              -p 80:80 \
              github-actions-demo