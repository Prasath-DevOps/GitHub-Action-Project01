name: DevOps Mini Project

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Files
        run: |
          echo "GitHub Actions is running successfully!"
          echo "Project files:"
          ls -la

      - name: Test Docker
        run: docker --version